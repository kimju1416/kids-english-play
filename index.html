<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>영어 모션 놀이터</title>
<meta name="theme-color" content="#BEE3F8">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Pretendard',sans-serif;color:#2b3d3d;
  background:linear-gradient(160deg,#BEE3F8 0%,#D6F5D6 45%,#FFE9C2 100%);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all;
  overscroll-behavior:none;}
button{font-family:inherit;border:none;cursor:pointer;}

#stage{position:fixed;inset:0;background:#000;}
video{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);filter:brightness(.92) saturate(1.05);}
video.rear{transform:none;}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(190,227,248,.3) 100%);}

.screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:22px;background:linear-gradient(160deg,#BEE3F8 0%,#D6F5D6 45%,#FFE9C2 100%);overflow-y:auto;}
.screen.show{display:flex;}

.mascot{width:120px;height:120px;filter:drop-shadow(0 10px 18px rgba(40,80,120,.25));animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}

.big-btn{background:linear-gradient(160deg,#7FC7F0,#3E9BDB);color:#fff;border-radius:34px;padding:22px 52px;
  font-size:26px;font-weight:900;box-shadow:0 10px 0 #2E7BB0,0 16px 26px rgba(62,155,219,.4);min-height:78px;}
.big-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #2E7BB0,0 8px 16px rgba(62,155,219,.35);}
.ghost-btn{background:#fff;color:#3a6a5a;border:3px solid #B8E8CE;border-radius:28px;padding:16px 34px;
  font-size:19px;font-weight:800;min-height:62px;box-shadow:0 6px 0 #B8E8CE;}
.ghost-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B8E8CE;}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

#hubScr{justify-content:flex-start;padding:0;}
.hub-in{max-width:560px;margin:0 auto;padding:28px 18px 30px;width:100%;}
.hub-title{font-size:clamp(26px,7.5vw,40px);font-weight:900;text-align:center;color:#2a5a7a;text-shadow:2px 2px 0 #fff;}
.hub-sub{text-align:center;font-size:15px;color:#4a7a6a;margin:10px 0 24px;line-height:1.6;font-weight:700;}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.gcard{position:relative;background:#fff;border-radius:28px;padding:20px 14px 16px;text-align:center;
  box-shadow:0 8px 0 var(--sh,#B8E8CE),0 14px 20px rgba(40,90,90,.14);border:4px solid var(--bd,#D6F5D6);}
.gcard:active{transform:translateY(5px);box-shadow:0 3px 0 var(--sh,#B8E8CE);}
.gcard .gicon{font-size:52px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12));}
.gcard .gname{font-size:16.5px;font-weight:900;margin-top:8px;color:#2a4a4a;}
.gcard .gdesc{font-size:11.5px;color:#6a9a8a;margin-top:4px;font-weight:700;}
.gcard .gbest{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:900;color:#fff;background:linear-gradient(160deg,#7FC7F0,#3E9BDB);
  border-radius:99px;padding:3px 10px;box-shadow:0 2px 0 #2E7BB0;}
.hub-foot{text-align:center;margin-top:26px;font-size:11px;color:#6a9a8a;line-height:1.8;}
.hub-foot .insta{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:#3a8ac9;text-decoration:none;font-weight:800;
  background:#fff;border-radius:99px;padding:8px 16px;border:2px solid #BEE3F8;}

#introScr .gtitle{font-size:clamp(26px,7.5vw,36px);font-weight:900;margin:14px 0 8px;color:#2a5a7a;}
#introScr .gdesc2{font-size:16px;color:#4a7a6a;line-height:1.8;max-width:380px;font-weight:700;margin-bottom:6px;}
#loadMsg{margin-top:12px;font-size:13px;color:#6a9a8a;font-weight:700;min-height:1.2em;max-width:340px;}

#hudTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:none;
  justify-content:space-between;align-items:flex-start;z-index:6;gap:8px;}
#hudTop.show{display:flex;}
.hbtn{display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:#3a6a5a;
  border-radius:16px;padding:0 14px;font-size:13px;font-weight:900;box-shadow:0 4px 0 #B8E8CE;
  min-height:44px;white-space:nowrap;}
.hbtn.show{display:inline-flex;}
.hud-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
#bigCounter{position:absolute;top:calc(env(safe-area-inset-top) + 66px);left:50%;transform:translateX(-50%);z-index:6;display:none;
  background:rgba(255,255,255,.92);border-radius:26px;padding:8px 26px;box-shadow:0 6px 0 #B8E8CE;text-align:center;}
#bigCounter.show{display:block;}
#cNum{font-size:40px;font-weight:900;color:#3E9BDB;line-height:1;font-variant-numeric:tabular-nums;}
#cNum.pop{animation:pop .3s cubic-bezier(.2,1.7,.4,1);}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.28);}100%{transform:scale(1);}}
#cLbl{font-size:10.5px;font-weight:800;color:#5a9a7a;letter-spacing:1.5px;margin-top:1px;}
#timerChip{position:absolute;top:calc(env(safe-area-inset-top) + 66px);right:14px;z-index:6;display:none;text-align:center;
  background:rgba(255,255,255,.92);border-radius:20px;padding:7px 16px;box-shadow:0 5px 0 #B8E8CE;}
#timerChip.show{display:block;}
#timerVal{font-size:26px;font-weight:900;color:#2a5a7a;font-variant-numeric:tabular-nums;}
#stateTxt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16%);
  max-width:92vw;text-align:center;font-size:min(6vw,24px);font-weight:900;z-index:6;color:#2a5a7a;
  background:rgba(255,255,255,.9);border-radius:20px;padding:11px 20px;box-shadow:0 6px 0 #B8E8CE;line-height:1.4;}
#stateTxt:empty{display:none;}
#repeatBtn{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:7;display:none;
  align-items:center;justify-content:center;gap:7px;background:rgba(255,255,255,.94);color:#2a5a7a;
  border-radius:999px;padding:0 22px;min-height:58px;font-size:16px;font-weight:900;
  box-shadow:0 5px 0 #B8E8CE,0 10px 18px rgba(40,90,90,.2);}
#repeatBtn.show{display:inline-flex;}
#repeatBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #B8E8CE;}
#countdown{position:absolute;inset:0;z-index:18;display:none;align-items:center;justify-content:center;
  background:rgba(190,227,248,.85);font-size:min(40vw,180px);font-weight:900;color:#3E9BDB;text-shadow:3px 3px 0 #fff;}

#resultScr .stars{font-size:44px;margin-bottom:10px;letter-spacing:6px;}
#resultScr .rnum{font-size:min(22vw,88px);font-weight:900;color:#3E9BDB;text-shadow:3px 3px 0 #fff;line-height:1;}
#resultScr .rsub{font-size:19px;font-weight:800;color:#2a5a7a;margin-top:8px;}

@media (prefers-reduced-motion:reduce){ .mascot,#cNum.pop{animation:none;} }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="cv"></canvas>
  <div id="vignette"></div>

  <div id="hudTop">
    <button class="hbtn show" id="homeBtn">🏠 처음</button>
    <div class="hud-btns">
      <button class="hbtn" id="flipBtn">🔄 화면전환</button>
      <button class="hbtn" id="viewBtn">전체 보기</button>
      <button class="hbtn" id="endBtn">그만할래요</button>
    </div>
  </div>
  <div id="bigCounter"><div id="cNum">0</div><div id="cLbl">개</div></div>
  <div id="timerChip"><div id="timerVal">25</div></div>
  <div id="stateTxt"></div>
  <button id="repeatBtn">🔊 다시 듣기</button>
  <div id="countdown">3</div>

  <!-- 허브 -->
  <div id="hubScr" class="screen show">
    <div class="hub-in">
      <div class="hub-title">🦉 영어 모션 놀이터</div>
      <div class="hub-sub">카메라 앞에 서서 몸으로 영어를 배워요!<br>어른과 함께 2~3걸음 뒤로 물러나 주세요 🙆</div>
      <div class="game-grid">
        <button class="gcard" data-g="abc" style="--bd:#FFD9D9;--sh:#E89A9A"><div class="gicon">🔤</div><div class="gname">알파벳 콕콕</div><div class="gdesc">듣고 알맞은 글자를 콕!</div></button>
        <button class="gcard" data-g="listen" style="--bd:#D6F5D6;--sh:#93D693"><div class="gicon">👂</div><div class="gname">픽처 리스닝</div><div class="gdesc">듣고 알맞은 그림을 콕!</div></button>
        <button class="gcard" data-g="phonics" style="--bd:#FFE39A;--sh:#E0BE5E"><div class="gicon">🐹</div><div class="gname">파닉스 두더지</div><div class="gdesc">시작하는 소리를 찾아요!</div></button>
        <button class="gcard" data-g="spell" style="--bd:#FFD9D9;--sh:#F0A8B8"><div class="gicon">🔡</div><div class="gname">스펠링 콕콕</div><div class="gdesc">그림 보고 순서대로 콕!</div></button>
        <button class="gcard" data-g="color" style="--bd:#E5D4FF;--sh:#B79AE8"><div class="gicon">🎨</div><div class="gname">컬러 점프</div><div class="gdesc">색깔 이름 듣고 콕!</div></button>
        <button class="gcard" data-g="simon" style="--bd:#C7E8FF;--sh:#8FC4E8"><div class="gicon">🙆</div><div class="gname">바디파츠 사이먼</div><div class="gdesc">Touch your head! 몸으로!</div></button>
      </div>
      <div class="hub-foot">🔒 영상은 저장되지 않고 기기 안에서만 사용돼요<br>
        <a class="insta" href="https://www.instagram.com/kimju.zip" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="0.7" fill="currentColor" stroke="none"/></svg>
          kimju.zip</a></div>
    </div>
  </div>

  <!-- 인트로 -->
  <div id="introScr" class="screen">
    <svg class="mascot" id="introMascot" viewBox="0 0 120 120"></svg>
    <div class="gtitle" id="introTitle"></div>
    <p class="gdesc2" id="introDesc"></p>
    <div class="btn-row" style="margin-top:20px">
      <button class="ghost-btn" id="introBack">← 놀이터로</button>
      <button class="big-btn" id="introStart">시작!</button>
    </div>
    <div id="loadMsg"></div>
  </div>

  <!-- 결과 -->
  <div id="resultScr" class="screen">
    <svg class="mascot" id="resultMascot" viewBox="0 0 120 120"></svg>
    <div class="stars" id="resStars">⭐⭐⭐</div>
    <div class="rnum" id="resNum">0</div>
    <div class="rsub" id="resSub"></div>
    <div class="btn-row" style="margin-top:26px">
      <button class="ghost-btn" id="resHomeBtn">🏠 놀이터로</button>
      <button class="big-btn" id="resAgainBtn">또 할래요!</button>
    </div>
  </div>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const DEBUG=params.get('debug')==='1';

/* ---------- 마스코트(부엉이) ---------- */
const OWL='<g>'
  +'<ellipse cx="60" cy="66" rx="46" ry="42" fill="#8FA9C7"/>'
  +'<path d="M18,40 Q28,10 42,34 Z" fill="#6E88A8"/><path d="M102,40 Q92,10 78,34 Z" fill="#6E88A8"/>'
  +'<circle cx="42" cy="58" r="20" fill="#fff"/><circle cx="78" cy="58" r="20" fill="#fff"/>'
  +'<circle cx="42" cy="58" r="10.5" fill="#3d2b1f"/><circle cx="78" cy="58" r="10.5" fill="#3d2b1f"/>'
  +'<circle cx="45" cy="54" r="3" fill="#fff"/><circle cx="81" cy="54" r="3" fill="#fff"/>'
  +'<path d="M60,66 L52,78 Q60,84 68,78 Z" fill="#F0A840"/>'
  +'<ellipse cx="60" cy="98" rx="17" ry="10" fill="#D9C9A8"/>'
  +'<path d="M6,88 Q2,60 10,44 Q14,74 26,92 Z" fill="#7A96B8"/><path d="M114,88 Q118,60 110,44 Q106,74 94,92 Z" fill="#7A96B8"/>'
  +'</g>';
$('introMascot').innerHTML=OWL; $('resultMascot').innerHTML=OWL;

/* ---------- 음성 안내(TTS) ---------- */
function primeVoices(){ try{ speechSynthesis.getVoices(); }catch(e){} }
primeVoices();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=primeVoices;
function say(text,forceEn){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=forceEn||(/[A-Za-z]/.test(text)&&!/[가-힣]/.test(text))?'en-US':'ko-KR';
    u.rate=forceEn?0.85:0.92; u.pitch=1.2;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 사운드 ---------- */
let actx=null;
function initAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(freq,dur,vol){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.value=freq||660;
  g.gain.value=0; o.connect(g); g.connect(actx.destination);
  const t=actx.currentTime;
  g.gain.linearRampToValueAtTime(vol||0.22,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.2));
  o.start(t); o.stop(t+(dur||0.2)+0.02);
}
function cheer(){ beep(660,0.12); setTimeout(()=>beep(880,0.14),110); setTimeout(()=>beep(1046,0.22),220); }
function buzz(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }

/* ============================================================
   공용 코어: 카메라·좌표계 (kids-motion-play와 동일 검증 로직)
   ============================================================ */
const video=$('cam'), canvas=$('cv'), ctx=canvas.getContext('2d');
let pose=null, fileset=null, camOn=false, facing='user', lastVideoTime=-1;
const map={s:1,ox:0,oy:0,W:0,H:0,vw:720,vh:1280,mode:'contain'};
let viewPref='contain';
try{ viewPref=localStorage.getItem('kep_view')||'contain'; }catch(e){}
function updateMap(){
  const W=innerWidth||375, H=innerHeight||812;
  const vw=(camOn&&video.videoWidth)?video.videoWidth:720;
  const vh=(camOn&&video.videoHeight)?video.videoHeight:1280;
  const vA=vw/vh, sA=W/H;
  const mismatch=Math.max(vA/sA,sA/vA);
  const mode=(viewPref==='contain')?'contain':(mismatch>1.12?'contain':'cover');
  const s=mode==='contain'?Math.min(W/vw,H/vh):Math.max(W/vw,H/vh);
  map.s=s; map.ox=(W-vw*s)/2; map.oy=(H-vh*s)/2; map.W=W; map.H=H; map.vw=vw; map.vh=vh; map.mode=mode;
  canvas.width=W; canvas.height=H;
  if(camOn) video.style.objectFit=mode;
  const vb=$('viewBtn'); if(vb) vb.textContent=(mode==='contain')?'꽉 채우기':'전체 보기';
}
addEventListener('resize',updateMap); updateMap();
function toPx(l){
  let x=l.x*map.vw*map.s+map.ox;
  const y=l.y*map.vh*map.s+map.oy;
  if(facing==='user') x=map.W-x;
  return {x,y};
}
function visOf(l){ return (l&&l.visibility!=null)?l.visibility:1; }
function angle(a,b,c){
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const dot=v1.x*v2.x+v1.y*v2.y, m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
  if(!m) return 180;
  return Math.acos(Math.max(-1,Math.min(1,dot/m)))*180/Math.PI;
}
async function loadModels(){
  if(pose||DEBUG) return;
  $('loadMsg').textContent='준비하는 중… (처음엔 조금 걸려요)';
  fileset=fileset||await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  pose=await PoseLandmarker.createFromOptions(fileset,{
    baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',delegate:'GPU'},
    runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:0.3,minPosePresenceConfidence:0.3,minTrackingConfidence:0.3
  });
}
async function startCam(){
  if(DEBUG){ camOn=true; updateMap(); return; }
  if(camOn&&video.srcObject) return;
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;
  video.classList.toggle('rear',facing==='environment');
  await new Promise(r=>video.onloadedmetadata=r);
  await video.play();
  camOn=true; updateMap();
}
function stopCam(){ const s=video.srcObject; if(s) s.getTracks().forEach(t=>t.stop()); video.srcObject=null; camOn=false; }

function drawPose(lms,col){
  col=col||'#3E9BDB';
  const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  ctx.lineWidth=Math.max(4,map.W/110); ctx.lineCap='round'; ctx.strokeStyle=col; ctx.shadowBlur=14; ctx.shadowColor=col;
  BONES.forEach(([a,b])=>{ if(visOf(lms[a])<0.2||visOf(lms[b])<0.2) return;
    const A=toPx(lms[a]),B=toPx(lms[b]); ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); });
  ctx.shadowBlur=0; ctx.fillStyle='#fff';
  [0,11,12,15,16,23,24,25,26].forEach(i=>{ if(visOf(lms[i])<0.2) return; const P=toPx(lms[i]);
    ctx.beginPath(); ctx.arc(P.x,P.y,Math.max(5,map.W/90),0,Math.PI*2); ctx.fill(); });
}
function setState(t){ $('stateTxt').textContent=t||''; }

/* ---------- 손 추적(4점 평균+속도, 세그먼트 히트) ---------- */
let handTrack={L:null,R:null};
function hands2(lms){
  const now=performance.now(), out=[];
  [['L',15,19,17,21],['R',16,20,18,22]].forEach(arr=>{
    const k=arr[0];
    const pts=arr.slice(1).filter(i=>lms[i]&&visOf(lms[i])>0.3).map(i=>toPx(lms[i]));
    if(!pts.length){ handTrack[k]=null; return; }
    const x=pts.reduce((s,p)=>s+p.x,0)/pts.length, y=pts.reduce((s,p)=>s+p.y,0)/pts.length;
    const prev=handTrack[k];
    const dt=prev?Math.max(16,now-prev.t):16;
    const h={x,y,px:prev?prev.x:x,py:prev?prev.y:y,vx:prev?(x-prev.x)/dt*1000:0,vy:prev?(y-prev.y)/dt*1000:0,spd:0,t:now};
    h.spd=Math.hypot(h.vx,h.vy);
    handTrack[k]=h; out.push(h);
  });
  return out;
}
function segHit(h,cx,cy,r){
  const dx=h.x-h.px, dy=h.y-h.py, L2=dx*dx+dy*dy;
  if(L2<1) return Math.hypot(h.x-cx,h.y-cy)<r;
  let t=((cx-h.px)*dx+(cy-h.py)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(h.px+dx*t-cx,h.py+dy*t-cy)<r;
}
function anySegHit(hs,cx,cy,r){ return hs.some(h=>segHit(h,cx,cy,r)); }
function anyNear(hs,cx,cy,r){ return hs.some(h=>Math.hypot(h.x-cx,h.y-cy)<r); }
function drawHandGlow(pts,col){

/* ============================================================
   배치 시스템 — 보기는 "카메라 영상이 실제로 보이는 영역" 안에만 둔다.
   화면 높이(map.H)로 배치하면, 폰이 가로(16:9) 스트림을 줄 때 영상이
   화면 중앙 좁은 띠에만 letterbox로 들어가서 보기 절반이 검은 여백
   (=아이 머리 위)에 떠버린다. 손이 절대 닿지 않는 자리가 된다.
   ============================================================ */
function band(){
  const l=Math.max(0,map.ox), r=Math.min(map.W,map.ox+map.vw*map.s);
  const t=Math.max(0,map.oy), b=Math.min(map.H,map.oy+map.vh*map.s);
  return {l,r,t,b,w:Math.max(80,r-l),h:Math.max(80,b-t)};
}
/* 아이가 서 있을 때 손이 닿는 구간: 영상 밴드의 위 15% ~ 74%(머리~허리) */
function layoutN(n){
  const B=band();
  const padX=Math.max(8,B.w*0.03);
  const x0=B.l+padX, x1=B.r-padX;
  const y0=B.t+B.h*0.15, y1=B.t+B.h*0.74;
  const AW=Math.max(60,x1-x0), AH=Math.max(60,y1-y0);
  const RMAX=Math.min(map.W,map.H)/7;
  // 한 줄 / 두 줄 / 세 줄 중 반지름이 가장 큰(=가장 잘 보이는) 구성을 고른다
  const fit=rows=>{ const cols=Math.ceil(n/rows);
    return {rows,cols,r:Math.min(AW/(cols*2.25),AH/(rows*2.25),RMAX)}; };
  let best=fit(1);
  for(const rows of [2,3]){ if(rows>n) break; const f=fit(rows); if(f.r>best.r) best=f; }
  const {rows,cols}=best, r=Math.max(20,Math.round(best.r));
  const cellW=AW/cols, cellH=AH/rows;
  const cells=[];
  for(let i=0;i<n;i++){
    const rI=(i/cols)|0, cI=i%cols;
    const inRow=Math.min(cols,n-rI*cols);              // 마지막 줄이 덜 차면 가운데 정렬
    const off=(cols-inRow)*cellW/2;
    cells.push({x:x0+off+cellW*(cI+0.5), y:y0+cellH*(rI+0.5)});
  }
  // 지터는 셀 반칸을 넘지 않게 — 매번 위치가 조금 달라지되 절대 겹치지 않는다
  const jx=Math.max(0,(cellW/2-r)*0.55), jy=Math.max(0,(cellH/2-r)*0.55);
  return shuffle(cells).map(c=>({
    x:clamp(c.x+(Math.random()*2-1)*jx, x0+r, x1-r),
    y:clamp(c.y+(Math.random()*2-1)*jy, y0+r, y1-r),
    r
  }));
}
/* 문제(🔊·그림 힌트)를 보기 위쪽, 영상 밴드 안에 그린다 */
function drawHint(txt,size){
  const B=band();
  ctx.save(); ctx.font=Math.round(size||Math.min(map.W,map.H)*0.11)+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(txt,map.W/2,B.t+B.h*0.075); ctx.restore();
}

/* ============================================================
   셔플백 — 풀을 한 바퀴 다 돌기 전에는 같은 문제가 다시 안 나온다.
   남은 항목을 localStorage에 저장해 새로고침·재시작해도 이어진다.
   ============================================================ */
function bagNext(key,pool,idOf){
  idOf=idOf||(x=>String(x));
  const LS='kep_bag_'+key, LSL=LS+'_last';
  let ids=null, last=null;
  try{ ids=JSON.parse(localStorage.getItem(LS)||'null'); last=localStorage.getItem(LSL); }catch(e){}
  const valid=pool.map(idOf);
  if(Array.isArray(ids)) ids=ids.filter(id=>valid.indexOf(id)>=0);   // 단어 목록이 바뀌어도 안전
  if(!Array.isArray(ids)||!ids.length){
    ids=shuffle(valid.slice());
    // 새 백의 첫 문제가 직전 문제와 같아지는 것만 피한다
    if(last!=null&&ids.length>1&&ids[0]===last){ const j=1+((Math.random()*(ids.length-1))|0); [ids[0],ids[j]]=[ids[j],ids[0]]; }
  }
  const id=ids.shift();
  try{ localStorage.setItem(LS,JSON.stringify(ids)); localStorage.setItem(LSL,id); }catch(e){}
  return pool[valid.indexOf(id)]||pool[0];
}
/* 오답 보기 — 화면에 보이는 값(distinctBy) 기준으로 서로 겹치지 않게 뽑는다.
   prefer가 있으면 그쪽을 우선(헷갈리는 글자군 등) */
function pickWrong(pool,target,n,distinctBy,prefer){
  const seen={}, out=[];
  seen[distinctBy(target)]=1;
  const order=prefer?shuffle(prefer.slice()).concat(shuffle(pool.slice())):shuffle(pool.slice());
  for(const p of order){
    const v=distinctBy(p);
    if(seen[v]) continue;
    seen[v]=1; out.push(p);
    if(out.length>=n) break;
  }
  return out;
}

const BEST_CFG={
  abc:{unit:'문제',dir:'max'}, listen:{unit:'문제',dir:'max'}, phonics:{unit:'문제',dir:'max'},
  color:{unit:'문제',dir:'max'}, simon:{unit:'개',dir:'max'}, spell:{unit:'단어',dir:'max'}
};
function bestKey(k){ return 'kep_best_'+k; }
function getBest(k){ try{ const v=localStorage.getItem(bestKey(k)); return v==null?null:parseFloat(v); }catch(e){ return null; } }
function recordBest(k,val){
  const cfg=BEST_CFG[k]; if(!cfg||val==null||isNaN(val)) return false;
  if(cfg.dir!=='min'&&val<=0) return false;   // 0점은 최고기록으로 저장하지 않음
  const cur=getBest(k);
  const better=cur==null||(cfg.dir==='min'?val<cur:val>cur);
  if(better){ try{ localStorage.setItem(bestKey(k),String(val)); }catch(e){} }
  return better;
}
function renderHubBests(){
  document.querySelectorAll('.gcard[data-g]').forEach(btn=>{
    const k=btn.dataset.g, cfg=BEST_CFG[k]; if(!cfg) return;
    let el=btn.querySelector('.gbest');
    const v=getBest(k);
    if(v==null){ if(el) el.remove(); return; }
    if(!el){ el=document.createElement('div'); el.className='gbest'; btn.appendChild(el); }
    const shown=cfg.decimals?v.toFixed(cfg.decimals):Math.round(v);
    el.textContent='🏆 최고 '+shown+cfg.unit;
  });
}

function burst26(x,y,col){
  const out=[]; for(let i=0;i<26;i++){ const a=Math.random()*6.28;
    out.push({x,y,vx:Math.cos(a)*(140+Math.random()*220),vy:Math.sin(a)*(140+Math.random()*220)-70,t:performance.now(),col}); }
  return out;
}
function drawFx(G,now){
  G.rings=(G.rings||[]).filter(rg=>{
    const age=now-rg.t; if(age>500) return false;
    const k=age/500;
    ctx.save(); ctx.globalAlpha=1-k; ctx.strokeStyle='#93D693'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r+10+k*46,0,Math.PI*2); ctx.stroke(); ctx.restore();
    return true;
  });
  G.fx=(G.fx||[]).filter(p=>{
    const age=now-p.t; if(age>650) return false;
    const dt2=16/1000;
    p.x+=p.vx*dt2; p.y+=p.vy*dt2; p.vy+=600*dt2;
    const al=1-age/650;
    ctx.save(); ctx.globalAlpha=al; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,Math.PI*2); ctx.fill(); ctx.restore();
    return true;
  });
}

function bubble(x,y,r,st,ring){
  ctx.save(); ctx.fillStyle='#fff'; ctx.shadowBlur=12; ctx.shadowColor='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.lineWidth=6; ctx.strokeStyle=st.isOk?'#2F9E5A':(st.wrongPick?'#E04B4B':ring); ctx.stroke();
  ctx.restore();
}
function makeQuiz(cfg){
  const G={};
  function gen(){
    const n=(cfg.choices||choiceCount)(G.round);
    const target=bagNext(cfg.key,cfg.pool,cfg.idOf);
    const wrong=pickWrong(cfg.pool,target,n-1,cfg.distinctBy,cfg.prefer?cfg.prefer(target,G.round):null);
    const items=shuffle([target].concat(wrong));
    const pts=layoutN(items.length);
    G.q={target,ok:items.indexOf(target),pick:-1,lock:true,done:false,doneAt:0,
      items:items.map((it,i)=>({it,x:pts[i].x,y:pts[i].y,r:pts[i].r}))};
    cfg.speak(target);
  }
  function choose(i,c,now){
    const q=G.q; q.done=true; q.doneAt=now; q.pick=i;
    const right=(i===q.ok);
    if(right){ G.ok++; cheer(); buzz(30); setState(cfg.okMsg(q.target));
      G.fx.push(...burst26(c.x,c.y,'#93D693')); G.rings.push({x:c.x,y:c.y,t:now,r:c.r}); }
    else{ beep(300,0.2); buzz([0,60,40,60]); setState(cfg.ngMsg(q.target)); }
    G.round++; $('cNum').textContent=G.round+'/'+ROUNDS;
    setTimeout(()=>{
      if(G.done||current!==API) return;          // 그만두기·홈으로 나간 뒤 늦게 도는 것 방지
      if(G.round>=ROUNDS) API.finish(); else gen();
    }, right?950:1600);                          // 오답은 정답을 보여줄 시간을 더 준다
  }
  const API={
    key:cfg.key, hud:{counter:true,end:true,repeat:true}, intro:cfg.intro,
    start(){ G.round=0; G.ok=0; G.fx=[]; G.rings=[]; G.done=false;
      $('cNum').textContent='0/'+ROUNDS; $('cLbl').textContent='문제'; gen(); },
    end(){ API.finish(); },
    repeat(){ if(G.q) cfg.speak(G.q.target); },
    frame(lms){
      const now=performance.now(); let hands=[];
      if(lms){ drawPose(lms,cfg.accent); hands=hands2(lms); drawHandGlow(hands,cfg.accent); }
      else setState('몸이 보이게 서 주세요');
      const q=G.q; if(!q) return;
      drawHint(cfg.hint(q.target));
      // 손이 보기에서 한 번 떨어져야 터치를 받는다(다음 문제로 넘어가자마자 오터치 방지).
      // locked는 '이 프레임 시작 시점'의 잠금 — 잠금이 풀리는 프레임에는 판정하지 않는다.
      // 안 그러면 직전 프레임에서 이어진 손 궤적이 새 보기를 스쳐 바로 선택돼버린다.
      const locked=q.lock;
      if(q.lock && (!hands.length || !q.items.some(c=>anyNear(hands,c.x,c.y,c.r+16)))) q.lock=false;
      q.items.forEach((c,i)=>{
        const isOk=q.done&&i===q.ok, wrongPick=q.done&&i===q.pick&&q.pick!==q.ok;
        const pop=isOk?1+Math.sin(Math.min(1,(now-q.doneAt)/260)*Math.PI)*0.26:1;
        cfg.drawItem(c.it,c.x,c.y,c.r*pop,{isOk,wrongPick});
        if(!locked&&hands.length&&!q.done&&!q.lock&&anySegHit(hands,c.x,c.y,c.r+16)) choose(i,c,now);
      });
      drawFx(G,now);
    },
    finish(){ if(G.done) return; G.done=true;
      const isNew=recordBest(cfg.key,G.ok);
      showResult({num:G.ok,total:ROUNDS,numTxt:G.ok+'/'+ROUNDS,
        sub:'문제 맞혔어요! '+cfg.emoji+(isNew?' 🏆 신기록!':''),
        voice:ROUNDS+'문제 중에 '+G.ok+'개 맞혔어요! '+cfg.praise});
    },
    _dbg(){ return G; }        // 자동 점검용
  };
  return API;
}

/* ---------- 🙆 바디파츠 사이먼(TPR) ---------- */
GAME.simon=(()=>{
  const G={};
  const HOLD=0.7, RTIME=10;
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const seen=(l,arr)=>arr.every(i=>l[i]&&visOf(l[i])>0.3);
  /* 판정은 모두 '관절 사이 거리' 기반 — 카메라 좌우반전·전후면 전환에 영향받지 않는다.
     needs = 그 동작을 판정하려면 보여야 하는 관절 */
  const ACTIONS=[
    {id:'head',label:'Touch your head!',ko:'머리를 만져요',needs:[0,15,16],
      check:l=>Math.min(d(l[15],l[0]),d(l[16],l[0]))<0.13},   // 만세와 구분되게 조임
    {id:'shoulders',label:'Touch your shoulders!',ko:'어깨를 만져요',needs:[11,12,15,16],
      check:l=>d(l[15],l[11])<0.15||d(l[16],l[12])<0.15},
    {id:'knees',label:'Touch your knees!',ko:'무릎을 만져요',needs:[25,26,15,16],
      check:l=>d(l[15],l[25])<0.16||d(l[16],l[26])<0.16},
    {id:'toes',label:'Touch your toes!',ko:'발끝을 만져요',needs:[27,28,15,16],
      check:l=>Math.max(l[15].y,l[16].y)>(l[27].y+l[28].y)/2-0.1},
    {id:'up',label:'Raise your hands!',ko:'두 손 번쩍 만세!',needs:[0,15,16],
      check:l=>l[15].y<l[0].y&&l[16].y<l[0].y},
    {id:'tummy',label:'Touch your tummy!',ko:'배를 만져요',needs:[11,12,23,24,15,16],
      // 어깨/가슴을 만진 걸 '배'로 쳐주면 바디파츠를 잘못 가르치게 된다 →
      // 몸통 한가운데 + 어깨보다 확실히 아래, 골반보다 위일 것
      check:l=>{ const shY=(l[11].y+l[12].y)/2, hipY=(l[23].y+l[24].y)/2;
        const p={x:(l[11].x+l[12].x)/2, y:(shY+hipY)/2};
        const near=w=>d(w,p)<0.12 && w.y>shY+(hipY-shY)*0.35 && w.y<hipY;
        return near(l[15])||near(l[16]); }},
    {id:'ears',label:'Touch your ears!',ko:'두 귀를 만져요',needs:[7,8,15,16],
      check:l=>d(l[15],l[7])<0.15&&d(l[16],l[8])<0.15},
    {id:'clap',label:'Clap your hands!',ko:'손뼉을 짝!',needs:[15,16],
      check:l=>d(l[15],l[16])<0.10},
    {id:'wide',label:'Open your arms wide!',ko:'팔을 활짝 벌려요',needs:[11,12,15,16],
      // 손목이 '몸 중심에서 제 어깨와 같은 쪽으로, 어깨보다 더 바깥'에 있어야 한다.
      // 가로 거리만 보면 안쪽으로 모은 손(귀 만지기·팔짱)도 통과해버린다.
      check:l=>{ const cx=(l[11].x+l[12].x)/2;
        const out=(w,s)=>(w.x-cx)*(s.x-cx)>0 && Math.abs(w.x-cx)>Math.abs(s.x-cx)*1.6;
        return out(l[15],l[11]) && out(l[16],l[12])
            && Math.abs(l[15].y-l[11].y)<0.18 && Math.abs(l[16].y-l[12].y)<0.18; }},
    {id:'hips',label:'Touch your hips!',ko:'양손을 허리에!',needs:[23,24,15,16],
      // 팔을 그냥 내리고 서 있어도 손목이 골반 옆에 오므로 x가 골반과 겹치는지까지 본다
      check:l=>Math.abs(l[15].x-l[23].x)<0.06 && Math.abs(l[15].y-l[23].y)<0.12
            && Math.abs(l[16].x-l[24].x)<0.06 && Math.abs(l[16].y-l[24].y)<0.12},
    {id:'cross',label:'Cross your arms!',ko:'팔을 X자로 안아요',needs:[11,12,15,16],
      // 각 손이 '제 어깨보다 반대쪽 어깨에 더 가까워야' 진짜 팔짱
      check:l=>d(l[15],l[12])<d(l[15],l[11]) && d(l[16],l[11])<d(l[16],l[12])
            && d(l[15],l[12])<0.15 && d(l[16],l[11])<0.15},
    {id:'onehand',label:'One hand up!',ko:'한 손만 번쩍!',needs:[0,11,12,15,16],
      check:l=>{ const h=l[0].y, a=l[15].y<h, b=l[16].y<h;
        return (a&&!b&&l[16].y>l[12].y)||(b&&!a&&l[15].y>l[11].y); }}
  ];
  /* 12개를 섞어 큐에 넣고 10개를 뽑는다 → 한 판 안에서는 절대 같은 동작이 두 번 안 나온다.
     보이지 않는 관절이 필요한 동작(발끝인데 발이 화면 밖)은 뒤로 미룬다. */
  function pick(){
    if(!G.queue.length) G.queue=shuffle(ACTIONS.slice());
    let a=null;
    for(let t=0;t<G.queue.length;t++){
      if(!G.lastLms||seen(G.lastLms,G.queue[t].needs)){ a=G.queue.splice(t,1)[0]; break; }
    }
    if(!a) a=G.queue.shift();
    G.action=a; G.holdT=0; G.roundStart=performance.now(); G.prevT=G.roundStart; G.done=false;
    say(a.label,true);
  }
  const API={
    key:'simon', hud:{counter:true,end:true,repeat:true},
    intro:{title:'바디파츠 사이먼 🙆',desc:'영어 지시를 듣고 <b>몸으로 따라해요!</b> Touch your head!<br>동작 12가지 중에서 10개 도전!'},
    start(){ G.round=0; G.ok=0; G.started=false; G.finished=false; G.lastLms=null;
      G.queue=shuffle(ACTIONS.slice()); pick();
      $('cNum').textContent='0/'+ROUNDS; $('cLbl').textContent='동작'; },
    end(){ API.finish(); },
    repeat(){ if(G.action) say(G.action.label,true); },
    frame(lms){
      const now=performance.now();
      // 카운트다운이 끝난 첫 프레임에 시계를 리셋(카운트다운이 제한시간을 잠식하지 않게)
      if(!G.started){ G.started=true; G.roundStart=now; G.prevT=now; }
      const dt=Math.min(0.1,Math.max(0.001,(now-G.prevT)/1000)); G.prevT=now;
      if(!lms){ setState('전신이 보이게 서 주세요'); return; }
      G.lastLms=lms;
      drawPose(lms,'#8FC4E8');
      if(G.done) return;
      const B=band();
      ctx.save();
      ctx.font='900 '+Math.max(19,Math.min(map.W/13,B.h/12))+'px Pretendard';
      ctx.fillStyle='#2a5a7a'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=6; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineJoin='round';
      const ly=B.t+B.h*0.1;
      ctx.strokeText(G.action.label,map.W/2,ly); ctx.fillText(G.action.label,map.W/2,ly);
      ctx.restore();
      const ok=G.action.check(lms);
      if(ok){ G.holdT+=dt; setState(G.holdT>=HOLD?'좋아요! 🎉':'그대로 유지해요…'); }
      else{ G.holdT=Math.max(0,G.holdT-dt*1.5); setState(G.action.ko); }
      // 유지 진행 막대 — 언제 성공하는지 눈으로 보이게
      const bw=Math.min(map.W*0.55,300), bx=(map.W-bw)/2, by=ly+Math.max(20,map.W/22);
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,.8)'; rrCtx(bx,by,bw,12,6); ctx.fill();
      ctx.fillStyle='#5AB86E'; rrCtx(bx,by,bw*Math.min(1,G.holdT/HOLD),12,6); ctx.fill();
      ctx.restore();
      const elapsed=(now-G.roundStart)/1000;
      if(G.holdT>=HOLD){
        G.done=true; G.ok++; G.round++;
        $('cNum').textContent=G.round+'/'+ROUNDS;
        const n=$('cNum'); n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
        beep(760,0.14); buzz(30); cheer();
        setTimeout(()=>{ if(G.finished||current!==API) return;
          if(G.round>=ROUNDS) API.finish(); else pick(); },900);
      }else if(elapsed>RTIME){
        G.done=true; G.round++;
        $('cNum').textContent=G.round+'/'+ROUNDS;
        setState('다음 동작으로 넘어가요!');
        setTimeout(()=>{ if(G.finished||current!==API) return;
          if(G.round>=ROUNDS) API.finish(); else pick(); },700);
      }
    },
    finish(){ if(G.finished) return; G.finished=true;
      const isNew=recordBest('simon',G.ok);
      showResult({num:G.ok,total:ROUNDS,numTxt:G.ok+'/'+ROUNDS,
        sub:'동작 성공! 🙆'+(isNew?' 🏆 신기록!':''),
        voice:ROUNDS+'개 중에 '+G.ok+'개 성공했어요! Well done!'});
    },
    _dbg(){ return G; }, _actions:ACTIONS        // 자동 점검용
  };
  return API;
})();

/* ---------- 🔡 스펠링 콕콕(알파벳 순서대로 터치) ---------- */
GAME.spell=(()=>{
  const G={};
  const WORDS=[ /* 55단어 — 그림을 보고 철자를 맞춘다 */
    {w:'CAT',e:'🐱'},{w:'DOG',e:'🐶'},{w:'PIG',e:'🐷'},{w:'COW',e:'🐮'},{w:'SUN',e:'☀️'},{w:'BEE',e:'🐝'},
    {w:'EGG',e:'🥚'},{w:'BUS',e:'🚌'},{w:'CAR',e:'🚗'},{w:'HAT',e:'🎩'},{w:'CUP',e:'🥤'},{w:'KEY',e:'🔑'},
    {w:'BOX',e:'📦'},{w:'FOX',e:'🦊'},{w:'BED',e:'🛏️'},{w:'PEN',e:'🖊️'},{w:'VAN',e:'🚐'},{w:'OWL',e:'🦉'},
    {w:'ANT',e:'🐜'},{w:'BAG',e:'🎒'},{w:'CAP',e:'🧢'},
    {w:'MILK',e:'🥛'},{w:'FISH',e:'🐟'},{w:'BIRD',e:'🐦'},{w:'STAR',e:'⭐'},{w:'BOOK',e:'📖'},{w:'TREE',e:'🌳'},
    {w:'BALL',e:'⚽'},{w:'CAKE',e:'🍰'},{w:'DUCK',e:'🦆'},{w:'FROG',e:'🐸'},{w:'GOAT',e:'🐐'},{w:'HAND',e:'✋'},
    {w:'LION',e:'🦁'},{w:'MOON',e:'🌙'},{w:'NOSE',e:'👃'},{w:'RAIN',e:'🌧️'},{w:'SHIP',e:'🚢'},{w:'SNOW',e:'❄️'},
    {w:'BOAT',e:'⛵'},{w:'CORN',e:'🌽'},{w:'DOOR',e:'🚪'},{w:'BEAR',e:'🐻'},{w:'KITE',e:'🪁'},
    {w:'APPLE',e:'🍎'},{w:'HOUSE',e:'🏠'},{w:'TIGER',e:'🐯'},{w:'TRAIN',e:'🚂'},{w:'CLOUD',e:'☁️'},
    {w:'HORSE',e:'🐴'},{w:'MOUSE',e:'🐭'},{w:'SHEEP',e:'🐑'},{w:'PIZZA',e:'🍕'},{w:'BREAD',e:'🍞'},{w:'CANDY',e:'🍬'}
  ];
  function newWord(){
    const it=bagNext('spell',WORDS,x=>x.w);
    const pts=layoutN(it.w.length);
    G.item=it; G.word=it.w; G.next=1; G.lock=true;
    G.targets=it.w.split('').map((ch,i)=>({ch,n:i+1,x:pts[i].x,y:pts[i].y,r:pts[i].r,done:false}));
    $('cLbl').textContent=it.w;
    say(it.w,true);
  }
  const API={
    key:'spell', hud:{counter:true,end:true,repeat:true},
    intro:{title:'스펠링 콕콕 🔡',desc:'그림을 보고 <b>알파벳을 순서대로 손으로 콕!</b><br>C-A-T 처럼 차례로 눌러 단어를 완성해요.<br>단어 55개 중에서 10단어 도전!'},
    start(){ G.round=0; G.ok=0; G.miss=0; G.fx=[]; G.rings=[]; G.done=false; G.pending=false;
      $('cNum').textContent='0/'+ROUNDS; newWord(); },
    end(){ API.finish(); },
    repeat(){ if(G.word) say(G.word,true); },
    frame(lms){
      const now=performance.now(); let hands=[];
      if(lms){ drawPose(lms,'#F0A8B8'); hands=hands2(lms); drawHandGlow(hands,'#F0A8B8'); }
      else setState('몸이 보이게 서 주세요');
      drawHint(G.item.e);
      // 잠금이 풀리는 프레임에는 판정하지 않는다(위 makeQuiz와 같은 이유)
      const locked=G.lock;
      if(G.lock && (!hands.length || !G.targets.some(t=>anyNear(hands,t.x,t.y,t.r+16)))) G.lock=false;
      let cleared=false;
      G.targets.forEach(t=>{
        if(t.done) return;
        const isNext=(t.n===G.next);
        ctx.save(); ctx.fillStyle='#fff'; ctx.shadowBlur=10; ctx.shadowColor='rgba(0,0,0,.15)';
        ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
        ctx.lineWidth=6; ctx.strokeStyle=isNext?'#E8608A':'#e5d8c8'; ctx.stroke();
        ctx.font='900 '+Math.round(t.r*0.92)+'px Pretendard'; ctx.fillStyle=isNext?'#2a4a4a':'#c9b89a';
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.ch,t.x,t.y+2);
        if(isNext){ const k=1+Math.sin(now/160)*0.08;
          ctx.beginPath(); ctx.arc(t.x,t.y,t.r*k+9,0,Math.PI*2); ctx.strokeStyle='#E8608A'; ctx.lineWidth=3; ctx.stroke(); }
        ctx.restore();
        if(!locked&&hands.length&&!G.lock&&!cleared&&anySegHit(hands,t.x,t.y,t.r+16)){
          if(isNext){
            t.done=true; G.next++; beep(520+t.n*80,0.1); buzz(30);
            if(G.next>G.word.length){
              G.ok++; G.round++; cleared=true;
              $('cNum').textContent=G.round+'/'+ROUNDS;
              const nn=$('cNum'); nn.classList.remove('pop'); void nn.offsetWidth; nn.classList.add('pop');
              setState(G.word+' 완성! 🎉'); cheer(); buzz([0,50,40,50]);
              G.fx.push(...burst26(t.x,t.y,'#93D693')); G.rings.push({x:t.x,y:t.y,t:now,r:t.r});
            } else setState(t.ch+'! 다음 글자를 찾아봐요');
          } else { G.miss++; setState(G.word[G.next-1]+' 를 먼저 눌러요!'); beep(220,0.12); G.lock=true; }
        }
      });
      drawFx(G,now);
      if(cleared&&!G.pending){
        G.pending=true;
        setTimeout(()=>{ G.pending=false;
          if(G.done||current!==API) return;
          if(G.round>=ROUNDS) API.finish(); else newWord(); },1200);
      }
    },
    finish(){ if(G.done) return; G.done=true;
      const isNew=recordBest('spell',G.ok);
      showResult({num:G.ok,total:ROUNDS,numTxt:G.ok+'/'+ROUNDS,
        sub:'단어 완성했어요! 🔡'+(isNew?' 🏆 신기록!':'')
          +(G.miss?'<br><span style="font-size:14px;color:#6a9a8a;font-weight:700">순서 실수 '+G.miss+'번</span>':''),
        voice:G.ok+'단어 완성했어요! Amazing speller!'});
    },
    _dbg(){ return G; }        // 자동 점검용
  };
  return API;
})();

window.__app={ openIntro, startActivity, goHub, GAME,
  get current(){ return current; }, get running(){ return running; },
  /* 자동 점검용 훅 */
  _t:{ band, layoutN, bagNext, pickWrong, choiceCount, shuffle, ROUNDS,
       pools:{LETTERS,PIC,PHON,COLORS}, get map(){ return map; } } };
</script>
